# FILE NÀY LÀM GÌ: Phục vụ khách và chuyển tiếp đúng whitelist API công khai hiện có.
# CHỨC NĂNG: Theo dõi DNS Docker; IP API có thể đổi sau restart/tạo lại container.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream hue_catalog { zone hue_catalog 64k; server catalog:8788 resolve; }
upstream hue_presence { zone hue_presence 64k; server presence:8787 resolve; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8m;

    # Du khách không được tải entry quản lý hoặc giao diện tạo/chia sẻ QR.
    location ~ ^/(admin|qr)(/|$) { return 404; }

    # Giữ nguyên Range/HEAD của Nginx để audio từ SQL vẫn tua được.
    location ~ "^/api/catalog/(published|version|gate/entry|audio/published/[a-f0-9]{64}\.mp3|media/published/[a-f0-9]{64}|images/published/[a-z0-9-]+\.jpg)$" {
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass http://hue_catalog;
        proxy_set_header Origin "";
        proxy_read_timeout 190s;
    }
    location ~ ^/api/presence/sessions/(heartbeat|end)$ {
        rewrite ^/api/presence/(.*)$ /$1 break;
        proxy_pass http://hue_presence;
        proxy_set_header Origin "";
    }
    # API không có trong whitelist phải trả 404, không trả nhầm index.html của SPA.
    location /api/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
