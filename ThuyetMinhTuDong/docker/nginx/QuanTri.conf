# FILE NÀY LÀM GÌ: Site quản lý riêng, chỉ được publish trên localhost trong Compose.
# CHỨC NĂNG: Tự cập nhật IP nội bộ khi API được khởi động lại/tạo lại.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream hue_catalog { zone hue_catalog 64k; server catalog:8788 resolve; }
upstream hue_presence { zone hue_presence 64k; server presence:8787 resolve; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8m;

    # Tài nguyên nháp và lệnh quản lý chỉ đi qua site quản lý.
    location /api/catalog/ {
        proxy_pass http://hue_catalog/;
        proxy_set_header Origin "";
        proxy_read_timeout 190s; # Dịch/tạo audio có thể lâu hơn truy vấn thông thường.
    }
    location /api/presence/ {
        proxy_pass http://hue_presence/;
        proxy_set_header Origin "";
    }
    location /api/ { return 404; }
    location ~ ^/qr(/|$) { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
